name: "[Template] Sub-issue status rollup"

# Reusable workflow — called from a thin wrapper in each consuming repo.
# Rolls a parent issue's native status UP from the statuses of its native
# GitHub sub-issues (Feature → Story → Task/Bug), one direction only
# (child → parent, never parent → child):
#   - any child started (In progress / In review / Done), not all Done
#       → parent In progress
#   - ALL children Done → parent Done (which closes it as completed)
#   - children closed as Not planned / Duplicate are excluded from the
#       rollup, so a won't-fix slice can't block the parent forever.
#
# "Done" means the child's status is Done. A task whose PR has merged waits in
# "In review" until QA moves it to Done (our repos have GitHub's auto-close of
# linked issues on merge turned off), so it counts as started, not done, and
# the last merge can't mark a Story done before QA.
#
# Statuses are read by category (backlog / planned / started / completed /
# not_planned / duplicate), not by display name. An issue created before
# native statuses existed can still have no status at all; it is classified by
# its open/closed state and close reason instead.
#
# Triggers: `status_changed` on a child — fired for a human's change, GitHub's
# own automations (PR linked, assignment) and a close or reopen — the
# sub_issue_* / parent_issue_* re-parenting events, and a `work-status-changed`
# repository_dispatch that qa-routing sends after its own status writes. Those
# are made with GITHUB_TOKEN, so they fire no `status_changed`, and the
# dispatch (which GITHUB_TOKEN CAN raise) is how the rollup hears about them.
#
# Self-contained, by necessity: a status written with the default GITHUB_TOKEN
# does NOT trigger further workflow runs, so this can't lean on a re-fired
# rollup to climb from Story to Feature. It walks up the ancestor chain within
# the same run instead. Each climb keeps its own `visited` set to stop it
# looping, so a later climb still recomputes an ancestor an earlier one saw.
#
# Forward-only: it only ever advances a parent toward Done. It never walks a
# parent back off In progress / In review / Done — a child reopening under an
# already-closed parent does NOT reopen the parent; that's left to a human.
# The "all Backlog / Todo" case is likewise left alone, and so is a parent
# closed as Not planned / Duplicate (setting a status would reopen it).
#
# Same-repo only: GitHub sub-issues can cross repositories, but — like
# qa-routing — this skips any parent or child in another repo (their events
# fire in that repo, and this run can only read/write here).
#
# Concurrency caveat: two child events for the SAME parent can run concurrently
# and race on the parent's status (one computes Done, another In progress). The
# forward-only guard uses each run's own snapshot, so the later writer can still
# move a parent back within that narrow window. Each run recomputes from the
# parent's live children, so any subsequent event on that parent self-corrects;
# a hard guarantee would need a per-parent lock GitHub Actions can't express.
#
# Sub-issue linking must be the NATIVE sub-issue relationship (GitHub's
# sub-issue UI / API), not a "#123" mention in the description.

on:
  workflow_call: {}

permissions:
  issues: write
  contents: read

jobs:
  rollup:
    # Self-hosted Windows runners by default. Set the org variable
    # ISSUE_WORKFLOWS_RUN_ON_HOSTED_RUNNER to 1 to run on GitHub-hosted ubuntu-slim
    # instead (e.g. while the self-hosted runners are down); any other value or
    # no variable at all means self-hosted. Self-hosted runners need Actions
    # Runner v2.327.1+ (actions/github-script v9 refuses to start on older).
    runs-on: ${{ fromJSON(vars.ISSUE_WORKFLOWS_RUN_ON_HOSTED_RUNNER == '1' && '["ubuntu-slim"]' || '["self-hosted","windows","qa-routing"]') }}
    steps:
      - name: Roll sub-issue statuses up to the parent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const IN_PROGRESS = 'In progress';
            const DONE = 'Done';

            // Native status IDs by name, looked up once per run so nothing is
            // hardcoded.
            const { repository: repoStatuses } = await github.graphql(
              `query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  planningStatuses(first: 20) { nodes { id name } }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            const statusId = Object.fromEntries(
              repoStatuses.planningStatuses.nodes.map(s => [s.name, s.id])
            );
            for (const name of [IN_PROGRESS, DONE]) {
              if (!statusId[name]) {
                core.setFailed(`Native issue status "${name}" not found in this repo — has GitHub renamed it?`);
                return;
              }
            }

            const sameRepo = `${context.repo.owner}/${context.repo.repo}`;

            // Status category of an issue: backlog / planned / started /
            // completed / not_planned / duplicate. An issue with no native
            // status yet (created before statuses existed) falls back to its
            // open/closed state: open → backlog, closed → by close reason.
            function categoryOf(issue) {
              const key = issue.status?.category?.key;
              if (key) return key;
              if (issue.state !== 'CLOSED') return 'backlog';
              if (issue.stateReason === 'NOT_PLANNED') return 'not_planned';
              if (issue.stateReason === 'DUPLICATE') return 'duplicate';
              return 'completed';
            }
            const EXCLUDED = ['not_planned', 'duplicate'];
            const STARTED_OR_DONE = ['started', 'completed'];

            const STATUS_FRAGMENT = `
              state
              stateReason
              status { name category { key } }`;

            // For an issue in THIS repo: its parent (number — only if the parent
            // is also in this repo) and whether it has sub-issues of its own.
            async function getMeta(number) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      parent { number repository { nameWithOwner } }
                      subIssues(first: 1) { totalCount }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, number }
              );
              const issue = repository.issue;
              if (!issue) return { parentNumber: null, hasChildren: false };
              const parentInRepo =
                issue.parent && issue.parent.repository.nameWithOwner === sameRepo;
              return {
                parentNumber: parentInRepo ? issue.parent.number : null,
                hasChildren: issue.subIssues.totalCount > 0,
              };
            }

            // Recompute one parent's status from its children. Returns true if
            // it wrote a change (so the caller climbs to the grandparent).
            async function recompute(parentNumber) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id
                      ${STATUS_FRAGMENT}
                      subIssues(first: 100) {
                        nodes {
                          number
                          repository { nameWithOwner }
                          ${STATUS_FRAGMENT}
                        }
                        pageInfo { hasNextPage }
                      }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: parentNumber }
              );

              const parent = repository.issue;
              if (!parent) {
                core.warning(`Parent #${parentNumber} not found — skipping.`);
                return false;
              }
              if (parent.subIssues.pageInfo.hasNextPage) {
                core.warning(`Parent #${parentNumber} has more than 100 sub-issues; only the first 100 are rolled up.`);
              }

              const parentCategory = categoryOf(parent);
              if (EXCLUDED.includes(parentCategory)) {
                core.info(`Parent #${parentNumber} is closed as ${parentCategory} — leaving alone.`);
                return false;
              }

              // Cross-repo children are skipped entirely (we can't track their
              // events here), and so are children closed as not planned /
              // duplicate — a won't-fix slice must neither block the parent nor
              // count as progress.
              const considered = parent.subIssues.nodes
                .filter(c => c.repository.nameWithOwner === sameRepo)
                .map(categoryOf)
                .filter(cat => !EXCLUDED.includes(cat));

              if (considered.length === 0) {
                core.info(`Parent #${parentNumber}: no same-repo, still-planned sub-issues to roll up — leaving alone.`);
                return false;
              }

              let desired;
              if (considered.every(cat => cat === 'completed')) {
                desired = DONE;
              } else if (considered.some(cat => STARTED_OR_DONE.includes(cat))) {
                desired = IN_PROGRESS;
              } else {
                // All children still Backlog / Todo — forward-only, so leave the
                // parent alone.
                core.info(`Parent #${parentNumber}: no child has started — leaving alone.`);
                return false;
              }

              const current = parent.status?.name ?? '(no status)';

              if (desired === DONE && parentCategory === 'completed') {
                return false;
              }
              // Never walk a parent backward: In progress only applies to a
              // parent that hasn't started yet. (Done always advances — it's
              // only reached when every child is done.)
              if (desired === IN_PROGRESS && STARTED_OR_DONE.includes(parentCategory)) {
                core.info(`Parent #${parentNumber} is "${current}" — not moving it back to In progress.`);
                return false;
              }

              // Setting Done also closes the parent as completed.
              await github.graphql(
                `mutation($issueId: ID!, $statusId: ID!) {
                  setIssueStatus(input: { issueId: $issueId, statusId: $statusId }) {
                    issue { id }
                  }
                }`,
                { issueId: parent.id, statusId: statusId[desired] }
              );
              core.info(`Parent #${parentNumber}: "${current}" → ${desired}.`);
              return true;
            }

            // Climb the ancestor chain in-run: recompute a parent, and if it
            // changed, recompute its own parent too (events wouldn't do this for
            // us). `visited` guards one climb against cycles. It's per climb,
            // not shared across roots: roots can come in any order (Feature
            // before Story), and a Story that changes later must still be able
            // to recompute the Feature an earlier climb already saw.
            async function rollUp(parentNumber, visited) {
              if (visited.has(parentNumber)) return;
              visited.add(parentNumber);
              const changed = await recompute(parentNumber);
              if (!changed) return;
              const meta = await getMeta(parentNumber);
              if (meta.parentNumber) await rollUp(meta.parentNumber, visited);
            }

            // Collect the issue numbers the event names, keeping only ones in THIS
            // repo — payload.issue is always local; payload.sub_issue /
            // parent_issue carry their own repository and may be cross-repo. A
            // work-status-changed repository_dispatch lists its (always local)
            // issues in client_payload.issues.
            const payload = context.payload;
            const named = new Set();
            const dispatched = payload.client_payload?.issues;
            for (const n of Array.isArray(dispatched) ? dispatched : []) {
              if (Number.isInteger(n) && n > 0) named.add(n);
            }
            for (const key of ['issue', 'sub_issue', 'parent_issue']) {
              const obj = payload[key];
              if (!obj || typeof obj.number !== 'number') continue;
              const repoFull = obj.repository && obj.repository.full_name;
              if (repoFull && repoFull !== sameRepo) {
                core.info(`Payload ${key} ${repoFull}#${obj.number} is in another repo — skipping.`);
                continue;
              }
              named.add(obj.number);
            }

            if (named.size === 0) {
              core.info('Event names no issue in this repo — nothing to roll up.');
              return;
            }

            // Turn the named issues into the parents to recompute: each named
            // issue's (same-repo) parent, plus any named issue that itself has
            // children. rollUp then climbs from there.
            const roots = new Set();
            for (const number of named) {
              try {
                const meta = await getMeta(number);
                if (meta.parentNumber) roots.add(meta.parentNumber);
                if (meta.hasChildren) roots.add(number);
              } catch (err) {
                core.warning(`Could not resolve relations for #${number}: ${err.message}`);
              }
            }

            if (roots.size === 0) {
              core.info('No parent issues involved — nothing to roll up.');
              return;
            }

            for (const parentNumber of roots) {
              try {
                await rollUp(parentNumber, new Set());
              } catch (err) {
                core.warning(`Could not roll up parent #${parentNumber}: ${err.message}`);
              }
            }
