name: "[Retired] PR-linked issue status"

# RETIRED — kept only so existing wrappers don't fail. Remove this repo's
# .github/workflows/pr-linked-status.yml wrapper.
#
# This workflow moved the org "Work status" issue field to In progress when a
# PR was linked to an issue. GitHub's native issue statuses do that by
# themselves: linking a draft PR sets In progress, a non-draft PR (or marking
# the draft ready for review) sets In review. See README.md ("Native issue
# statuses").

on:
  workflow_call: {}

jobs:
  retired:
    # Never runs: the calling job finishes as skipped, so a wrapper that is
    # still in place costs no runner time and doesn't fail.
    if: false
    runs-on: ubuntu-slim
    steps:
      - run: echo "Retired — remove the pr-linked-status wrapper."
