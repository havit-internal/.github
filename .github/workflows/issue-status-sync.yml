name: "[Retired] Issue status sync"

# RETIRED — kept only so existing wrappers don't fail. Remove this repo's
# .github/workflows/issue-status-sync.yml wrapper.
#
# This workflow kept the org "Work status" issue field and the issue's
# open/closed state in sync. GitHub's native issue statuses do that by
# themselves: Done / Not planned / Duplicate close the issue, and closing or
# reopening it sets the status. See README.md ("Native issue statuses").

on:
  workflow_call: {}

jobs:
  retired:
    # Never runs: the calling job finishes as skipped, so a wrapper that is
    # still in place costs no runner time and doesn't fail.
    if: false
    runs-on: ubuntu-slim
    steps:
      - run: echo "Retired — remove the issue-status-sync wrapper."
