name: Sub-issue status rollup

# Thin wrapper around the org reusable workflow. Rolls a parent issue's native
# status up from its native sub-issues: any child started → parent In progress,
# all children Done → parent Done. Forward-only, child → parent only.
# status_changed on a child drives it (it also fires on close and reopen); the
# sub-issue events catch re-parenting; work-status-changed is sent by
# qa-routing after its own status writes (its wrapper needs contents: write
# for that).
# See https://github.com/havit-internal/.github#sub-issue-status-rollup-workflow

on:
  issues:
    types: [status_changed,
            sub_issue_added, sub_issue_removed,
            parent_issue_added, parent_issue_removed]
  repository_dispatch:
    types: [work-status-changed]

jobs:
  rollup:
    permissions:
      issues: write
      contents: read
    uses: havit-internal/.github/.github/workflows/subissue-rollup.yml@main
