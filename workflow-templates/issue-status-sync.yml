name: Issue status sync

# Thin wrapper around the org reusable workflow. Keeps an issue's closed state
# and its Work status field (Done) in sync, both directions, and walks a
# reopened issue back to In progress.
# See https://github.com/havit-internal/.github#issue-status-sync-workflow

on:
  issues:
    types: [closed, reopened, field_added]

jobs:
  sync:
    permissions:
      issues: write
      contents: write   # only to wake subissue-rollup (repository_dispatch);
                        # read is enough if this repo doesn't run the rollup
    uses: havit-internal/.github/.github/workflows/issue-status-sync.yml@main
    with:
      runner: '["ubuntu-latest"]'   # optional — JSON array of runner labels.
                                    # Self-hosted needs Actions Runner v2.327.1+
