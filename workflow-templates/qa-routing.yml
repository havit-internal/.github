name: QA routing

# Thin wrapper around the org reusable workflow. On merge, routes every issue
# the PR closes to QA (Work-status → Ready for QA, assigns .github/QAOWNERS).
# See https://github.com/havit-internal/.github#qa-routing-workflow

on:
  pull_request:
    types: [closed]

jobs:
  route-to-qa:
    if: github.event.pull_request.merged == true
    permissions:
      issues: write
      pull-requests: read
      contents: read
    uses: havit-internal/.github/.github/workflows/qa-routing.yml@main
    with:
      runner: '["ubuntu-latest"]'   # optional — JSON array of runner labels
